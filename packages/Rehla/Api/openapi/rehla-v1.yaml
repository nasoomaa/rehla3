openapi: 3.1.0
info:
  title: Rehla Customer API
  version: 1.0.0
  description: Public & Customer REST API for Rehla Platform
servers:
  - url: /api/v1
    description: V1 Production / Local Server
paths:
  /auth/register:
    post:
      summary: Register customer account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                device_name:
                  type: string
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '422':
          $ref: '#/components/responses/ValidationProblem'

  /auth/login:
    post:
      summary: Login with customer credentials
      operationId: loginCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/ValidationProblem'

  /auth/logout:
    post:
      summary: Revoke active customer session token
      operationId: logoutCustomer
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/Problem'

  /order-submissions:
    post:
      summary: Submit new order with frozen price and idempotency key
      operationId: submitOrder
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/ValidationProblem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - trace_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        trace_id:
          type: string
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

  responses:
    Problem:
      description: Standard RFC 7807 Problem Details response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ValidationProblem:
      description: RFC 7807 Validation Problem Details response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
